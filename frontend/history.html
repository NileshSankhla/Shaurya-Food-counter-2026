<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        /* Aura Glow Utilities */
        .glow-aura {
            position: relative;
        }
        .glow-aura::before {
            content: '';
            position: absolute;
            inset: -10px;
            background: linear-gradient(135deg, rgba(150,73,0,0.15), rgba(208,129,255,0.15));
            filter: blur(40px);
            z-index: -1;
            border-radius: inherit;
        }
        /* Hide scrollbar for clean horizontal scrolling */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen pb-24">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-xl border-b border-outline-variant/30 transition-opacity duration-200 flat no shadows flex justify-between items-center px-margin-mobile h-16">
<img src="logo.png" alt="Shaurya Logo" class="h-10 object-contain relative z-10"/>
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
    <h1 class="font-display text-headline-md-mobile font-extrabold text-primary">CampusEats</h1>
</div>
<button class="text-primary hover:opacity-80 transition-opacity duration-200 p-2 rounded-full focus:outline-none relative z-10">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="pt-24 px-margin-mobile flex flex-col gap-lg pb-xl">
<!-- Header & Search Section -->
<div class="flex justify-between items-center">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Scan History</h2>
<button onclick="loadHistory()" class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-high text-primary hover:bg-surface-variant transition-colors" aria-label="Refresh History">
<span class="material-symbols-outlined text-[20px]">refresh</span>
</button>
</div>
<div class="relative w-full glow-aura rounded-DEFAULT">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant z-10" data-icon="search">search</span>
<input id="searchInput" class="w-full h-14 pl-12 pr-4 bg-surface-container-lowest border border-outline-variant/30 rounded-DEFAULT text-on-surface font-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors relative z-0" placeholder="Search QR ID or location..." type="text"/>
</div>
<!-- Filter Chips -->
<div class="flex gap-sm overflow-x-auto no-scrollbar py-2">
<button id="filter-all" class="filter-btn px-6 py-2 rounded-full bg-primary text-on-primary font-label-md text-label-md whitespace-nowrap shadow-[0_4px_12px_rgba(150,73,0,0.2)]">All Scans</button>
<button id="filter-success" class="filter-btn px-6 py-2 rounded-full bg-surface-container-lowest border border-outline-variant/30 text-on-surface-variant font-label-md text-label-md whitespace-nowrap hover:bg-surface-container-low transition-colors">Success</button>
<button id="filter-failed" class="filter-btn px-6 py-2 rounded-full bg-surface-container-lowest border border-outline-variant/30 text-on-surface-variant font-label-md text-label-md whitespace-nowrap hover:bg-surface-container-low transition-colors">Failed</button>
</div>
</section>
<!-- History Feed (Instagram style stack) -->
<section id="history-feed" class="flex flex-col gap-md">
    <!-- Items will be injected here via JavaScript -->
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 inset-x-0 mx-auto max-w-md z-50 rounded-t-[2rem] bg-surface/90 backdrop-blur-md border-t border-outline-variant/20 shadow-[0_-4px_20px_rgba(221,42,123,0.1)] flex justify-around items-center h-20 px-4 pb-safe">
<a href="dashboard.html" class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high/50 font-label-md text-label-md rounded-xl p-2 transition-transform duration-150 group">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform" data-icon="home">home</span>
<span class="font-display text-xs mt-1">Home</span>
</a>
<a href="scanner.html" class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high/50 font-label-md text-label-md rounded-xl p-2 transition-transform duration-150 group">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform" data-icon="qr_code_scanner">qr_code_scanner</span>
<span class="font-display text-xs mt-1">Scanner</span>
</a>
<!-- Active Tab: History -->
<a href="history.html" class="flex flex-col items-center justify-center text-primary font-bold bg-primary-container/20 rounded-xl px-3 py-1 scale-95 transition-transform duration-150 group">
<span class="material-symbols-outlined" data-icon="history" style="font-variation-settings: 'FILL' 1;">history</span>
<span class="font-display text-xs mt-1">History</span>
</a>
<a href="profile.html" class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high/50 font-label-md text-label-md rounded-xl p-2 transition-transform duration-150 group">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform" data-icon="person">person</span>
<span class="font-display text-xs mt-1">Profile</span>
</a>
</nav>
<script src="js/config.js"></script>
<script>
    const allBtn = document.getElementById('filter-all');
    const successBtn = document.getElementById('filter-success');
    const failedBtn = document.getElementById('filter-failed');
    const feed = document.getElementById('history-feed');
    
    let allData = [];

    async function loadHistory() {
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'login.html';
            return;
        }

        try {
            const res = await fetch(`${CONFIG.API_BASE_URL}/scan/history`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (res.status === 401) {
                localStorage.clear();
                window.location.href = 'login.html';
                return;
            }

            if (res.ok) {
                allData = await res.json();
                renderData(allData);
            }
        } catch (err) {
            console.error('Failed to load history', err);
        }
    }

    function renderData(data) {
        feed.innerHTML = '';
        data.forEach(item => {
            const isSuccess = item.status === 'success';
            const icon = isSuccess ? 'check_circle' : 'error';
            const iconColor = isSuccess ? 'text-primary-container' : 'text-error';
            const statusColor = isSuccess ? 'text-on-surface' : 'text-error';
            const title = isSuccess ? 'Student Verified' : 'Scan Failed';
            const subTitle = item.studentId;
            const actionText = isSuccess ? 'Valid Swipe' : (item.reason || 'Please try scanning again');
            
            const img = isSuccess 
                ? 'https://lh3.googleusercontent.com/aida-public/AB6AXuCXwAxrBV9Bqv2TVUewWRdJ3Ztst0nh3aZM81EmZS1nFpPQuxxOVAOKtLiyHE6bpy4IcZfwNJrYVaae2yVaqovzhvAEqYoyrSHMndghD725FANCiCa8TVsTH6QI4OI0x97NCwi5pbLKYAgNEm51B7Cpwzts0a3dpdEV3HmUXcpxSslP7wGcc-LEsON4hiN8vsb1l4mNrBwy1iqeZ7rlIzKRG33duAArwEWd5atXWEOlZ4L9mTkrRcmG-w' 
                : '/failed_scan.jpg';

            const dateStr = new Date(item.createdAt).toLocaleString();
            const mealTag = item.mealType ? ` • ${item.mealType}` : '';

            const html = `
                <article class="history-item ${item.status} bg-surface-container-lowest rounded-lg p-md flex flex-col gap-sm ${isSuccess ? 'glow-aura' : 'shadow-sm border border-outline-variant/10'} relative">
                <div class="flex justify-between items-start">
                <div class="flex items-center gap-xs">
                <span class="material-symbols-outlined ${iconColor}" style="font-variation-settings: 'FILL' 1;">${icon}</span>
                <span class="font-label-md text-label-md ${statusColor}">${isSuccess ? 'Success' : 'Failed'}${mealTag}</span>
                </div>
                <span class="font-body-md text-body-md text-on-surface-variant text-sm">${dateStr}</span>
                </div>
                <div class="flex items-center gap-md mt-xs">
                <div class="w-16 h-16 rounded-DEFAULT bg-surface-container overflow-hidden flex-shrink-0">
                <img class="w-full h-full object-cover ${!isSuccess ? 'grayscale opacity-50' : ''}" src="${img}"/>
                </div>
                <div class="flex flex-col">
                <h3 class="font-headline-md text-headline-md-mobile text-on-surface">${title}</h3>
                <p class="font-body-md text-body-md text-on-surface-variant">${subTitle}</p>
                </div>
                </div>
                <div class="h-px w-full bg-outline-variant/20 my-xs"></div>
                <div class="flex justify-between items-center">
                <span class="font-body-md text-body-md text-on-surface-variant">${actionText}</span>
                </div>
                </article>
            `;
            feed.innerHTML += html;
        });
    }

    function updateBtns(activeBtn) {
        [allBtn, successBtn, failedBtn].forEach(btn => {
            btn.className = "filter-btn px-6 py-2 rounded-full border border-outline-variant/30 text-on-surface-variant font-label-md text-label-md whitespace-nowrap hover:bg-surface-container-low transition-colors bg-surface-container-lowest";
        });
        activeBtn.className = "filter-btn px-6 py-2 rounded-full bg-primary text-on-primary font-label-md text-label-md whitespace-nowrap shadow-[0_4px_12px_rgba(150,73,0,0.2)]";
    }

    allBtn.onclick = () => {
        updateBtns(allBtn);
        renderData(allData);
    };
    successBtn.onclick = () => {
        updateBtns(successBtn);
        renderData(allData.filter(i => i.status === 'success'));
    };
    failedBtn.onclick = () => {
        updateBtns(failedBtn);
        renderData(allData.filter(i => i.status === 'failed'));
    };

    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        let filtered = allData;
        
        // Respect current active filter
        if (successBtn.classList.contains('bg-primary')) {
            filtered = filtered.filter(i => i.status === 'success');
        } else if (failedBtn.classList.contains('bg-primary')) {
            filtered = filtered.filter(i => i.status === 'failed');
        }

        if (query) {
            filtered = filtered.filter(i => 
                i.studentId.toLowerCase().includes(query) || 
                (i.mealType && i.mealType.toLowerCase().includes(query))
            );
        }
        renderData(filtered);
    });

    // Load on start
    loadHistory();
</script>
</body></html>
