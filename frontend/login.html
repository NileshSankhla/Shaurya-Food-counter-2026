<main class="w-full max-w-[400px] px-margin-mobile flex flex-col items-center relative z-10">
<!-- Reference Image Container (Hidden visually but included for layout context if needed, or displayed as requested by user - assuming they want it as part of the layout flow or a background element, here I will place it subtly or as a main hero if it's meant to be the layout guide. Since it says "following the layout of", I will include it as a decorative element or keep it hidden if it's purely structural reference. Let's include it as a hero graphic at the top before the logo, or perhaps it IS the logo/hero.) -->

<div class="absolute inset-0 bg-gradient-to-t from-surface-container-lowest via-transparent to-transparent z-10"></div>

</div>
<!-- Header / Logo Area -->
<div class="flex flex-col items-center mb-xl text-center">
<div class="w-20 h-20 rounded-full flex items-center justify-center mb-sm shadow-[0_0_20px_rgba(245,133,41,0.2)] bg-white/50">

</div>
<h1 class="font-display text-headline-lg-mobile text-on-surface tracking-tight">SHAURYA FOOD COUNTER</h1>
</div>
<!-- Login Form -->
<form id="login-form" class="w-full flex flex-col gap-md">
<p id="error-message" class="text-error text-center text-sm font-medium hidden"></p>
<!-- Email / Username Input -->
<div class="relative w-full group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-outline-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">person</span>
</div>
<input class="w-full h-[56px] pl-[44px] pr-4 bg-surface-bright border border-surface-variant rounded-[20px] font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:border-primary focus:ring-1 focus:ring-primary focus:bg-surface-container-lowest transition-all duration-200 outline-none" id="username" placeholder="Email / Username" type="text">
</div>
<!-- Password Input -->
<div class="relative w-full group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-outline-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="w-full h-[56px] pl-[44px] pr-[44px] bg-surface-bright border border-surface-variant rounded-[20px] font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:border-primary focus:ring-1 focus:ring-primary focus:bg-surface-container-lowest transition-all duration-200 outline-none" id="password" placeholder="Password" type="password">
<button id="toggle-password" class="absolute inset-y-0 right-0 pr-4 flex items-center text-outline-variant hover:text-primary transition-colors" type="button">
<span id="toggle-icon" class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end w-full px-2 mt-[-8px]">
<a class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors" href="#">Forgot password?</a>
</div>
<!-- Submit Button -->
<button class="btn-gradient w-full h-[56px] rounded-full flex items-center justify-center mt-sm relative overflow-hidden group" type="submit">
<span class="font-label-md text-label-md text-on-primary relative z-10 tracking-wide">Log in</span>
<!-- Inner glow effect on hover -->
<div class="absolute inset-0 bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity duration-300 z-0"></div>
</button>
</form>
<!-- Footer Help Link -->
<div class="mt-xl pt-lg">
<a class="font-label-md text-label-md text-outline-variant hover:text-on-surface-variant transition-colors flex items-center gap-2" href="#">
<span class="material-symbols-outlined text-[16px]">help_outline</span>
                Need help? Contact Admin
            </a>
</div>
</main>
<!-- Navigation Shell Suppression: As per rules, navigation shell (BottomNavBar/TopAppBar) is suppressed on Linear/Transactional screens like Login. -->

<script src="js/config.js"></script>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('error-message');
    
    errorMsg.classList.add('hidden');

    try {
        const response = await fetch(`${CONFIG.API_BASE_URL}/auth/login`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
            localStorage.setItem('token', data.token);
            localStorage.setItem('userName', data.name);
            window.location.href = 'dashboard.html';
        } else {
            errorMsg.innerText = data.message || 'Login failed';
            errorMsg.classList.remove('hidden');
        }
    } catch (err) {
        errorMsg.innerText = 'Server is unreachable';
        errorMsg.classList.remove('hidden');
    }
});

document.getElementById('toggle-password').addEventListener('click', function() {
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('toggle-icon');
    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.innerText = 'visibility';
    } else {
        passwordInput.type = 'password';
        toggleIcon.innerText = 'visibility_off';
    }
});
</script>
