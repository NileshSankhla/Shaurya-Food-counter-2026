<script src="js/config.js"></script>
<script>
    const token = localStorage.getItem('token');
    if (!token) {
        window.location.href = 'login.html';
    }
    
    // Optional: display user name
    const userName = localStorage.getItem('userName');
    if(userName) {
        const welcomeText = document.querySelector('h2');
        if(welcomeText) welcomeText.innerHTML = `Hello, ${userName.split(' ')[0]} 👋`;
    }

    // Fetch and display stats
    async function loadStats() {
        try {
            const res = await fetch(`${CONFIG.API_BASE_URL}/scan/stats`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            
            if (res.status === 401) {
                localStorage.clear();
                window.location.href = 'login.html';
                return;
            }

            if (res.ok) {
                const data = await res.json();
                document.getElementById('stat-total-meals').innerText = data.successful;
                document.getElementById('stat-total-scans').innerText = data.total;
                document.getElementById('stat-success').innerText = data.successful;
                document.getElementById('stat-failed').innerText = data.failed;
                
                const goal = 9999;
                const percent = Math.min(100, Math.round((data.successful / goal) * 100)) || 0;
                document.getElementById('daily-goal-bar').style.width = percent + '%';
            }
        } catch (error) {
            console.error('Failed to load stats', error);
        }
    }

    loadStats();
</script>
