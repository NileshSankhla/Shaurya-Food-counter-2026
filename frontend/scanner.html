<style>
        .glow-aura {
            position: absolute;
            width: 80%;
            height: 80%;
            background: radial-gradient(circle, rgba(245,133,41,0.2) 0%, rgba(208,129,255,0.1) 50%, rgba(255,255,255,0) 100%);
            filter: blur(40px);
            z-index: -1;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        
        .scan-line {
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #f58529, #d081ff, transparent);
            position: absolute;
            top: 0;
            left: 0;
            animation: scan 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            box-shadow: 0 0 10px rgba(245, 133, 41, 0.5);
        }

        @keyframes scan {
            0% { top: 10%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 90%; opacity: 0; }
        }

        .camera-frame {
            box-shadow: inset 0 0 0 2px rgba(221, 193, 177, 0.3);
        }
        
        .corner-marker {
            position: absolute;
            width: 32px;
            height: 32px;
            border: 3px solid #f58529;
            border-radius: 8px;
        }
        .corner-tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .corner-tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .corner-br { bottom: 20px; right: 20px; border-left: none; border-top: none; }
        
        /* Aggressive override for html5-qrcode injected elements */
        #reader {
            position: absolute !important;
            inset: 0 !important;
            width: 100% !important;
            height: 100% !important;
            overflow: hidden !important;
            margin: 0 auto;
        }

        #reader video {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
        }

        #reader img {
            display: none !important;
        }

        #reader canvas {
            display: none !important;
        }

        #reader__dashboard {
            display: none !important;
        }
    </style>

</div>
<!-- Action -->

                SCAN NEXT
            </button>

<script src="js/config.js"></script>
<script>
    const html5QrCode = new Html5Qrcode("reader");
    const qrConfig = {
        fps: 10,
        aspectRatio: 0.75,
        qrbox: {
            width: 250,
            height: 250
        }
    };
    const successModal = document.getElementById('success-modal');
    const modalHeader = successModal.querySelector('p.text-on-surface-variant');
    const icon = successModal.querySelector('span.material-symbols-outlined');
    const scannedIdElement = document.getElementById('scanned-id');
    const titleElement = successModal.querySelector('h3');
    
    let isProcessing = false;
    let currentMeal = 'Breakfast';

    function setMeal(meal) {
        currentMeal = meal;
        ['Breakfast', 'Lunch', 'Dinner'].forEach(m => {
            const btn = document.getElementById('btn-' + m);
            if (m === meal) {
                btn.className = "flex-1 py-2 text-sm font-label-md rounded-lg bg-primary text-on-primary shadow-sm transition-all";
            } else {
                btn.className = "flex-1 py-2 text-sm font-label-md rounded-lg text-on-surface-variant hover:text-on-surface transition-all";
            }
        });
    }

    // Fallback UI to stop scan manually
    function stopScan() {
        if(html5QrCode.isScanning) {
            html5QrCode.stop().catch(err => console.error("Failed to stop scanner", err));
        }
    }

    async function onScanSuccess(decodedText, decodedResult) {
        if (isProcessing) return; // Prevent multiple scans
        isProcessing = true;
        
        stopScan();

        // Show Verifying UI
        titleElement.innerText = 'VERIFYING...';
        modalHeader.innerText = 'Please wait';
        icon.innerText = 'hourglass_empty';
        icon.className = 'material-symbols-outlined text-outline-variant text-[60px] animate-pulse';
        scannedIdElement.innerText = decodedText;
        successModal.classList.remove('hidden');
        
        try {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            const response = await fetch(`${CONFIG.API_BASE_URL}/scan/verify`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ studentId: decodedText, mealType: currentMeal })
            });

            if (response.status === 401) {
                localStorage.clear();
                window.location.href = 'login.html';
                return;
            }

            const data = await response.json();
            
            // Adjust modal based on status
            if (response.ok && data.status === 'success') {
                titleElement.innerText = 'FOOD ISSUED';
                modalHeader.innerText = 'Student Verified';
                icon.innerText = 'check_circle';
                icon.className = 'material-symbols-outlined text-primary-container text-[80px] mb-sm drop-shadow-md';
            } else {
                titleElement.innerText = 'SCAN FAILED';
                modalHeader.innerText = data.reason || 'Verification Failed';
                icon.innerText = 'error';
                icon.className = 'material-symbols-outlined text-error text-[80px] mb-sm drop-shadow-md';
            }
            
        } catch (err) {
            console.error('API Error', err);
            titleElement.innerText = 'NETWORK ERROR';
            modalHeader.innerText = 'Server unreachable';
            icon.innerText = 'wifi_off';
            icon.className = 'material-symbols-outlined text-error text-[80px] mb-sm drop-shadow-md';
        }
    }

    // Start scanning
    html5QrCode.start({ facingMode: { exact: "environment" } }, qrConfig, onScanSuccess)
        .catch(err => {
            console.warn("Exact environment camera failed, falling back to default", err);
            html5QrCode.start({ facingMode: "environment" }, qrConfig, onScanSuccess)
                .catch(e => {
                    console.error("Camera access denied or failed", e);
                    alert('Please allow camera permissions and reload.');
                });
        });

    function scanNext() {
        successModal.classList.add('hidden');
        isProcessing = false;
        html5QrCode.start({ facingMode: { exact: "environment" } }, qrConfig, onScanSuccess)
            .catch(() => html5QrCode.start({ facingMode: "environment" }, qrConfig, onScanSuccess));
    }
</script>
