</section>
<!-- Information Bento -->

</div>

</div>
<!-- Info Card 2 -->
<div class="bg-surface-container-lowest p-md rounded-DEFAULT border border-surface-variant/50 shadow-sm flex items-center justify-between">
<div class="flex items-center gap-sm">

<!-- Info Card 3 -->

<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-tertiary-container">event</span>

</div>

</div>
</div>

<script src="js/config.js"></script>
<script>
    const token = localStorage.getItem('token');
    if (!token) {
        window.location.href = 'login.html';
    }

    // Set user name
    const userName = localStorage.getItem('userName');
    if(userName) {
        document.getElementById('profile-name').innerText = userName;
    }

    // Fetch and display total scans
    async function loadProfileStats() {
        try {
            const res = await fetch(`${CONFIG.API_BASE_URL}/scan/stats`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            
            if (res.status === 401) {
                localStorage.clear();
                window.location.href = 'login.html';
                return;
            }

            if (res.ok) {
                const data = await res.json();
                document.getElementById('profile-scans').innerText = data.total;
            }
        } catch (error) {
            console.error('Failed to load stats', error);
        }
    }

    loadProfileStats();
</script>
